[package]
name = "nsh-app-aidaemon"
description = "AIdaemon: chat, coding and agent management on desktop, web and terminal"
license = "MIT"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "=0.5.0"
nsh-base = "=0.5.0"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aidaemon-client-core = { path = "../../crates/aidaemon-client-core", default-features = false }
aidaemon-client-protocol = { path = "../../crates/client-protocol" }

# Desktop and terminal: the shared tokio link, on NSH's background threads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aidaemon-client-core = { path = "../../crates/aidaemon-client-core" }
tokio = { version = "1", features = ["sync"] }
dirs = "6"

[dev-dependencies]
nsh-engine = "=0.5.0"
nsh-testing = "=0.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "=0.5.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.5.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "=0.5.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }
