[package]
name = "nsh-app-aidaemon"
description = "AIdaemon: chat, coding and agent management on desktop, web and terminal"
license = "MIT"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

# `aidaemon app` and `aidaemon tui` launch it by this name.
[[bin]]
name = "aidaemon-app"
path = "src/main.rs"

[dependencies]
nsh-core = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-base = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
env_logger = "0.11"
log = "0.4"
serde_json = "1"
# Files go to the gateway as base64.
base64 = "0.23"
aidaemon-client-core = { path = "../../crates/aidaemon-client-core", default-features = false }
aidaemon-client-protocol = { path = "../../crates/client-protocol" }
# Timestamps in the owner's time.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

# Desktop and terminal: the shared tokio link, on NSH's background threads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aidaemon-client-core = { path = "../../crates/aidaemon-client-core" }
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.13", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock"] }
dirs = "6"
# The terminal build (`--tui`): NSH's terminal surface and its input glue.
nsh-platform-tui = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c", default-features = false, features = ["run-app"] }
nsh-tui-host = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-engine = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
ratatui-core = { version = "0.1.2", features = ["std", "layout-cache", "underline-color"] }
ratatui-crossterm = "0.1.2"
crossterm = "0.29"

# The browser: the page's socket, Web Crypto and storage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = "0.4"
futures = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
nsh-engine = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-testing = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

# nsh's crates come from a fork at v0.5.1 plus span padding
# (longbridge/nsh#2141, merged after 0.5.1: room at a span's ends) and
# vertical span padding (fork only: room above and below its background),
# for inline code's chip, web text runs on the DOM's baseline
# (longbridge/nsh#2216) and touch responders that keep their touches on
# the web (longbridge/nsh#2220, a drag handle in a scroll view). nsh's build takes every nsh crate from the one
# checkout the app declares; the patch sends crates.io's (those other nsh
# crates depend on) to it too. Back to crates.io once a release carries it.
[patch.crates-io]
nsh-base = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-core = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-dev = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-engine = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-i18n = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-js = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-macros = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-package = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-platform-apple = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-platform-linux = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-platform-macos = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-platform-tui = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-platform-windows = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-testing = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-tui-host = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
nsh-updater = { git = "https://github.com/davo20019/nsh", rev = "91c263722a731511476419f25decc701765b493c" }
