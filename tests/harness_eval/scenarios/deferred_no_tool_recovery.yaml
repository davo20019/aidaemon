name: deferred_no_tool_recovery
description: Deferred and false-in-progress texts are bounced until execution occurs
input: Find all Rust files that contain async fn and give me the top 3 files.
setup:
  # History note (2026-07-03): this fixture previously scripted three deferred
  # texts and "passed" by shipping the third one ("I'm going to run the search
  # now.") as a Succeeded final answer with zero tools executed — it
  # institutionalized exactly the unbacked-promise fabrication that the
  # false-in-progress guard (claims_false_in_progress, completion_phase) now
  # bounces. Today it pins: promissory texts never ship; the loop keeps
  # retrying until substantive content arrives.
  # The requirement is the model's own: its checklist declares an open
  # observation, which holds the run until a receipt satisfies it.
  session_id: eval_deferred_01
  routing_models: true
script:
  - tool_calls:
      - name: track_requirements
        arguments: '{"items":[{"text":"Search the Rust files","status":"pending","requires_observation":true}]}'
  - text: I'll search for all Rust files with async fn first.
  - tool_calls:
      - name: system_info
        arguments: "{}"
  - text: Found the files and compiled the async summary.
expect:
  max_turns: 4
  tool_dispatch_counts:
    track_requirements: 1
    system_info: 1
  final_text_contains_exact:
    - Found the files
  ext:
    # The promissory text is bounced, then the observation runs.
    execution_llm_calls_min: 4
    outcome: succeeded
