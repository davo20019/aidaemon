name: orchestrator_fallthrough_status
description: Simple status check falls through orchestrator into tool loop
input: Check my system status
setup:
  session_id: eval_fallthrough_status_01
  orchestrator: true
script:
  - tool_calls:
      - name: system_info
        arguments: "{}"
  - text: System inspected.
expect:
  proposed:
    tools_used:
      - system_info
  ext:
    orchestration_route: default_continue
    llm_calls_min: 1
    tool_calls_min: 1
    outcome: succeeded
    direct_return: false
