name: readonly_session_denies_write_and_preserves_file
description: A /readonly session denies write_file; the file is never written
session_id: eval_readonly_session_01
user_text: Write the word changed into /tmp/aidaemon-test/eval-readonly-session/protected.txt
session_mode: readonly
mock_responses:
  - tool_call:
      name: write_file
      arguments: '{"path":"/tmp/aidaemon-test/eval-readonly-session/protected.txt","content":"changed"}'
  - text: The write was denied because this chat is read-only; the file is unchanged.
expect:
  forbids_mutation: true
  tools_used:
    - write_file
  # The call was proposed and refused before dispatch, so it never ran.
  tool_dispatch_counts:
    write_file: 0
  forbidden_mutation_attempts_max: 1
