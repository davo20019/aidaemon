name: stall_unknown_tool
description: Repeated unknown tool calls stop before scripted final text
session_id: eval_stall_01
user_text: Use the unavailable stall tool
# The script is exactly what the run admits: every third consecutive failed
# call trips the kernel's stuck detector, which nudges twice and then stops
# the run, nine execution replies in all (the bound below also counts the two
# assessment calls). Strict mode fails the fixture if the loop asks for a
# tenth reply, and the consumption check fails it if the loop stops earlier.
mock_responses:
  - tool_call:
      name: unknown_stall_tool
      arguments: "{}"
  - tool_call:
      name: unknown_stall_tool
      arguments: "{}"
  - tool_call:
      name: unknown_stall_tool
      arguments: "{}"
  - tool_call:
      name: unknown_stall_tool
      arguments: "{}"
  - tool_call:
      name: unknown_stall_tool
      arguments: "{}"
  - tool_call:
      name: unknown_stall_tool
      arguments: "{}"
  - tool_call:
      name: unknown_stall_tool
      arguments: "{}"
  - tool_call:
      name: unknown_stall_tool
      arguments: "{}"
  - tool_call:
      name: unknown_stall_tool
      arguments: "{}"
expect:
  outcome: failed
  stop_reason: error
  llm_calls_max: 11
  # An unknown tool has no adapter, so no call may count as dispatched.
  tool_dispatch_counts:
    unknown_stall_tool: 0
