name: stall_unknown_tool
description: Repeated unknown tool calls stop before scripted final text
session_id: eval_stall_01
user_text: Use the unavailable stall tool
# The script is exactly what the budget guard admits: strict mode fails the
# fixture if the loop asks for a sixth reply, and the consumption check fails
# it if the loop stops earlier.
mock_responses:
  - tool_call:
      name: unknown_stall_tool
      arguments: "{}"
  - tool_call:
      name: unknown_stall_tool
      arguments: "{}"
  - tool_call:
      name: unknown_stall_tool
      arguments: "{}"
  - tool_call:
      name: unknown_stall_tool
      arguments: "{}"
  - tool_call:
      name: unknown_stall_tool
      arguments: "{}"
expect:
  outcome: failed
  stop_reason: error
  llm_calls_max: 7
  # An unknown tool has no adapter, so no call may count as dispatched.
  tool_dispatch_counts:
    unknown_stall_tool: 0
