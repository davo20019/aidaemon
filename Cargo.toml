[package]
name = "aidaemon"
version = "0.11.35"
edition = "2021"
description = "A personal AI agent that runs as a background daemon, accessible via Telegram, Slack, or Discord, with tool use, MCP integration, and persistent memory"
license = "MIT"
repository = "https://github.com/davo20019/aidaemon"
homepage = "https://aidaemon.ai/"
documentation = "https://docs.aidaemon.ai/"
readme = "README.md"
keywords = ["ai", "daemon", "telegram", "llm", "mcp"]
categories = ["command-line-utilities"]
exclude = ["*.db", "*.db-shm", "*.db-wal", ".env", "config.toml", "lcov.info", "*.profraw", "docs/"]

[[bin]]
name = "db_probe"
path = "src/bin/db_probe.rs"
required-features = ["encryption"]

[[bin]]
name = "computer_use_probe"
path = "src/bin/computer_use_probe.rs"
required-features = ["computer_use-macos"]

[dependencies]
shell-words = "1.1"
tokio = { version = "1", features = ["full"] }
teloxide = { version = "0.17", features = ["macros", "webhooks-axum"] }
reqwest = { version = "0.12", features = ["json", "blocking", "gzip", "deflate", "brotli", "stream"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
strum = { version = "0.27", features = ["derive"] }
async-imap = "0.10"
async-native-tls = "0.5"
async-std = { version = "1", features = ["attributes"] }
futures = "0.3"
axum = "0.8"
dialoguer = "0.11"
chromiumoxide = { version = "0.8", features = ["tokio-runtime"], default-features = false, optional = true }
shellexpand = "3"
dirs = "6"
fastembed = "4"
tokio-util = "0.7.18"
libc = "0.2"
libsqlite3-sys = { version = "0.30", optional = true }
llm_readability = "0.0"
htmd = "0.1"
croner = "3"
regex = "1"
globset = "0.4"
ignore = "0.4"
fd-lock = "4"
once_cell = "1"
# Cross-platform per-process cumulative CPU time + disk I/O, used by the
# background-process reaper to detect genuine progress (CPU/IO/output advancing)
# vs. a truly-stalled process. Default features disabled — we only need the
# `system` component (processes), not disks/networks/components.
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
serenity = { version = "0.12", features = ["client", "gateway", "model", "cache", "rustls_backend"], default-features = false, optional = true }
tokio-tungstenite = { version = "0.24", features = ["native-tls"], optional = true }
self_update = { version = "0.42", features = ["archive-tar", "compression-flate2"], default-features = false }
semver = "1"
zeroize = { version = "1", features = ["derive"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
hkdf = { version = "0.12", optional = true }
p256 = { version = "0.13", features = ["ecdh"], optional = true }
aes-gcm = { version = "0.10", optional = true }
portable-pty = { version = "0.8", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# keyring v4 dropped feature flags and moved `Entry` to `keyring-core`. The
# refactor is invasive (requires explicit `use_native_store` calls and
# rewriting every `keyring::Entry::new(...)` site); staying on v3 until that
# migration is scoped separately.
keyring = { version = "3", features = ["apple-native"] }
tikv-jemallocator = "0.6"
axuielement = { version = "0.9", optional = true }
xcap = { version = "0.9", optional = true }
enigo = { version = "0.6", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
tikv-jemallocator = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[features]
default = ["discord", "slack", "encryption", "browser", "terminal-bridge"]
browser = ["dep:chromiumoxide"]
discord = ["dep:serenity"]
slack = ["dep:tokio-tungstenite"]
execution-docker = []
terminal-bridge = [
    "dep:tokio-tungstenite",
    "dep:hkdf",
    "dep:p256",
    "dep:aes-gcm",
    "dep:portable-pty",
]
encryption = ["libsqlite3-sys/bundled-sqlcipher"]
computer_use = []
computer_use-macos = ["computer_use", "dep:axuielement", "dep:xcap", "dep:enigo"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
proptest = "1"
assert_cmd = "2"
serial_test = "3"
# `test-util` enables tokio's pausable fake clock (`#[tokio::test(start_paused = true)]`,
# `tokio::time::advance`) used by the deterministic bounded-wait browser tests.
tokio = { version = "1", features = ["test-util"] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/aidaemon-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/aidaemon-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/aidaemon-linux-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/aidaemon-macos-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/aidaemon-macos-aarch64.tar.gz"
