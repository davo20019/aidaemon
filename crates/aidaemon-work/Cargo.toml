[package]
name = "aidaemon-work"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "aidaemon SDK: goals, mandates, tasks, work coordination and notifications, with their SQLite store (experimental)"
repository = "https://github.com/davo20019/aidaemon"
homepage = "https://aidaemon.ai/"
publish = false

[features]
# Test-only behaviour that dependents' test builds need, as `cfg(test)` cannot
# reach across a crate boundary.
testing = ["aidaemon-events/testing"]

[dependencies]
aidaemon-events = { path = "../aidaemon-events" }
aidaemon-tools = { path = "../aidaemon-tools" }
anyhow = "1"
async-trait = "0.1"
croner = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
aidaemon-events = { path = "../aidaemon-events", features = ["testing"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
