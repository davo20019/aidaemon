[package]
name = "aidaemon-work"
description = "Goals, mandates, tasks and work coordination with a SQLite store; internal to aidaemon, no stability promise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-work"
readme = "README.md"
keywords = ["agent", "tasks", "goals", "sqlite", "llm"]
categories = ["database", "asynchronous"]
publish = false

[features]
# Test-only behaviour that dependents' test builds need, as `cfg(test)` cannot
# reach across a crate boundary.
testing = ["aidaemon-events/testing"]

[dependencies]
aidaemon-events = { version = "0.1.0", path = "../aidaemon-events" }
aidaemon-tools = { version = "0.1.0", path = "../aidaemon-tools" }
anyhow = "1"
async-trait = "0.1"
croner = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
aidaemon-events = { path = "../aidaemon-events", features = ["testing"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
