[package]
name = "aidaemon-channel-slack"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "aidaemon SDK: slack channel adapter (experimental)"
repository = "https://github.com/davo20019/aidaemon"
homepage = "https://aidaemon.ai/"
publish = false

[dependencies]
aidaemon-channels = { path = "../aidaemon-channels", features = ["http"] }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "net"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
aidaemon-channels = { path = "../aidaemon-channels", features = ["conformance"] }
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "time", "net", "io-util"] }
