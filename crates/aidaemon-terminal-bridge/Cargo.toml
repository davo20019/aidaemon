[package]
name = "aidaemon-terminal-bridge"
description = "The aidaemon terminal bridge: CLI coding agents in local PTYs, relayed end-to-end encrypted to the owner's chat sessions, plus the local attach, share and start commands; implementation crate of the aidaemon SDK, no stability promise (use it through aidaemon-sdk)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-terminal-bridge"
readme = "README.md"
keywords = ["agent", "terminal", "pty", "relay"]
categories = ["command-line-utilities", "asynchronous"]
# Integration tests need dev-dependencies that are not published with the crate;
# planning notes and the API snapshot stay in the repository.
exclude = ["tests/", "benches/"]
publish = false

[dependencies]
aidaemon-secrets = { version = "0.20.0", path = "../aidaemon-secrets", default-features = false }
aidaemon-tools = { version = "0.20.0", path = "../aidaemon-tools" }
aes-gcm = "0.11"
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
futures = "0.3"
hkdf = "0.13"
hmac = "0.13"
libc = "0.2"
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
portable-pty = "0.9"
rand = "0.10"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shell-words = "1.1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
