<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIdaemon</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --soft: #8881; --accent: #4a7dff; --warn: #d9822b; --bad: #d64545; --ok: #2f9e6a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  header .grow { flex: 1; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); }
  .pill.connected { border-color: var(--ok); color: var(--ok); }
  .pill.reconnecting, .pill.not_paired { border-color: var(--warn); color: var(--warn); }
  #waiting { font-size: 13px; opacity: .75; }
  header button, .card button, #tasks button, form button, #note button { padding: 4px 10px; border-radius: 5px; border: 1px solid var(--line); background: none; color: inherit; cursor: pointer; font: inherit; font-size: 13px; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  main { flex: 1; display: grid; grid-template-columns: 220px 1fr 240px; min-height: 0; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } #sessions, #tasks { display: none; } }
  aside, section { overflow-y: auto; border-right: 1px solid var(--line); }
  aside h2, section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; opacity: .6; margin: 10px 12px 4px; }
  #sessions button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; color: inherit; font: inherit; cursor: pointer; }
  #sessions button.on { background: var(--soft); }
  #chat { display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 12px; }
  .msg { margin: 0 0 12px; white-space: pre-wrap; }
  .msg b { display: block; font-size: 12px; opacity: .6; }
  .live, .note, .empty { opacity: .65; font-style: italic; }
  .empty { padding: 0 12px; }
  #note { margin: 8px 12px 0; padding: 6px 10px; border-radius: 6px; background: var(--soft); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  #note span { flex: 1; }
  .card { margin: 8px 12px; padding: 10px 12px; border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 6px; }
  .card.high, .card.critical { border-left-color: var(--bad); }
  .card .cardhead { font-size: 12px; opacity: .7; text-transform: uppercase; letter-spacing: .04em; }
  .card .why { font-size: 13px; opacity: .8; }
  .card code { display: block; font-size: 12px; opacity: .7; margin: 4px 0; white-space: pre-wrap; word-break: break-all; }
  .card .choices button { margin: 6px 6px 0 0; }
  .card button.yes { background: var(--accent); color: white; border-color: var(--accent); }
  #cards:not(.armed) kbd { opacity: .35; }
  #tasks .task { padding: 6px 12px; font-size: 14px; border-bottom: 1px solid var(--line); }
  form#send { display: flex; gap: 8px; padding: 10px 10px 4px; border-top: 1px solid var(--line); }
  form#send textarea { flex: 1; padding: 8px; font: inherit; resize: none; height: 2.6em; }
  #hint { font-size: 12px; opacity: .6; padding: 0 12px 8px; min-height: 1.4em; }
  #pair { max-width: 440px; margin: 40px auto; padding: 0 16px; }
  #pair input { width: 100%; padding: 8px; margin: 4px 0 10px; font: inherit; }
  #palette { position: fixed; inset: 0; background: #0006; display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; }
  #palette .box { width: min(560px, 92vw); background: Canvas; color: CanvasText; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  #palette input { width: 100%; padding: 12px; font: inherit; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; outline: none; }
  #palette ul { list-style: none; margin: 0; padding: 4px 0; max-height: 50vh; overflow-y: auto; }
  #palette li { padding: 7px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  #palette li.on { background: var(--soft); }
  #palette li small { opacity: .55; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>AIdaemon</h1>
  <span id="conn" class="pill connecting">Connecting…</span>
  <span id="waiting"></span>
  <span class="grow"></span>
  <button id="palettebtn" title="Sessions and commands">Ctrl+K</button>
  <button id="unpair" hidden>Unpair</button>
</header>
<div id="pair" hidden>
  <h2>Pair this device</h2>
  <p>Send <code>/pair_device</code> to your assistant (or run <code>aidaemon pair</code>) and enter the code it gives you. You'll confirm in that chat.</p>
  <form id="pairform">
    <label id="gatewayrow" hidden>Daemon address <input id="gateway" placeholder="https://daemon.example.invalid" autocomplete="off"></label>
    <label id="offerrow">Offer <input id="offer" autocomplete="off"></label>
    <label>Code <input id="code" autocomplete="off" required></label>
    <label>Name for this device <input id="devname" required></label>
    <button>Pair</button>
  </form>
  <p id="pairnote"></p>
</div>
<main id="app" hidden>
  <aside id="sessions"><h2>Sessions</h2><button data-new="1">+ New session <kbd>Alt+N</kbd></button><div id="sessionlist"></div></aside>
  <section id="chat">
    <h2 id="chattitle">New session</h2>
    <div id="note" hidden><span id="notetext"></span><button id="noteback">Back</button><button id="noteclose" title="Dismiss (Esc)">×</button></div>
    <div id="log"></div>
    <div id="cards"></div>
    <form id="send"><textarea id="text" placeholder="Message" autocomplete="off" rows="1"></textarea></form>
    <div id="hint"></div>
  </section>
  <aside id="tasks"><h2>Running</h2><div id="tasklist"></div></aside>
</main>
<div id="palette" hidden><div class="box"><input id="paletteinput" placeholder="Sessions and commands" autocomplete="off"><ul id="paletteitems"></ul></div></div>
<script type="module" src="/client/v1/app/app.js"></script>
</body>
</html>
