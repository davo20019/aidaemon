[package]
name = "aidaemon-shells"
description = "Conversation shells for aidaemon: one pseudo-terminal per conversation, started in its folder, that the owner's apps attach to and the agent can read; implementation crate of the aidaemon SDK, no stability promise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-shells"
keywords = ["agent", "terminal", "pty", "shell"]
categories = ["asynchronous", "command-line-interface"]

[features]
# `shared_terminal`: the agent reads the conversation's shell and types into
# it once the owner allows.
tool = ["dep:aidaemon-core", "dep:aidaemon-tools", "dep:anyhow", "dep:async-trait", "dep:serde", "dep:serde_json", "tokio/time"]

[dependencies]
aidaemon-core = { version = "0.25.0", path = "../aidaemon-core", optional = true }
aidaemon-tools = { version = "0.25.0", path = "../aidaemon-tools", optional = true }
anyhow = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.18"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
aidaemon-shells = { path = ".", features = ["tool"] }
aidaemon-tools = { path = "../aidaemon-tools", features = ["checkpoints", "docker", "oauth", "testing"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
aidaemon-core = { path = "../aidaemon-core", default-features = false, features = ["testing"] }
aidaemon-policies = { path = "../aidaemon-policies", default-features = false, features = ["otel"] }
aidaemon-secrets = { path = "../aidaemon-secrets", features = ["keychain"] }
