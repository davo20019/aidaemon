[package]
name = "aidaemon-bridge-connector"
description = "The daemon's side of e-ink access: dials out to an aidaemon bridge, completes the encrypted handshakes and serves each device's requests through the gateway's bridge router; implementation crate of the aidaemon SDK, no stability promise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[dependencies]
aidaemon-bridge-proto = { version = "=0.25.1", path = "../aidaemon-bridge-proto" }
aidaemon-client-gateway = { version = "0.25.1", path = "../aidaemon-client-gateway" }
aidaemon-client-protocol = { version = "0.25.1", path = "../client-protocol" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8" }
futures = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
p256 = { version = "0.14", features = ["ecdsa"] }
rand = "0.10"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
