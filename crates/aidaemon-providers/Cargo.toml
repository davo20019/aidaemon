[package]
name = "aidaemon-providers"
description = "LLM providers for aidaemon agents (OpenAI-compatible and Anthropic, streaming); implementation crate of the aidaemon SDK, no stability promise (use it through aidaemon-sdk)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-providers"
readme = "README.md"
keywords = ["llm", "openai", "anthropic", "agent", "streaming"]
categories = ["api-bindings", "asynchronous"]
# Integration tests need dev-dependencies that are not published with the crate;
# planning notes and the API snapshot stay in the repository.
exclude = ["tests/", "benches/"]
publish = false

[features]
# The ChatGPT subscription login (`chatgpt_login`): PKCE sign-in, the loopback
# callback, and a refresh-serializing credential owner over a `SecretStore`.
chatgpt-login = [
    "dep:aidaemon-secrets",
    "dep:anyhow",
    "dep:base64",
    "dep:chrono",
    "dep:rand",
    "dep:tokio",
    "dep:uuid",
]

[dependencies]
aidaemon-core = { version = "0.2.0", path = "../aidaemon-core" }
aidaemon-secrets = { version = "0.2.0", path = "../aidaemon-secrets", default-features = false, optional = true }
anyhow = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
rand = { version = "0.8", optional = true }
tokio = { version = "1", features = ["net", "io-util", "sync", "time"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
aidaemon-core = { path = "../aidaemon-core", features = ["testing"] }
tokio = { version = "1", features = ["full"] }
