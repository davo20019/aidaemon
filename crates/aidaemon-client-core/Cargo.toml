[package]
name = "aidaemon-client-core"
description = "The shared core of AIDaemon's own clients: the Client Gateway link (reconnect, resume, resend), the event reducer, and sign-in with the local token or a paired device key"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["agent", "client", "websocket"]
categories = ["network-programming"]
exclude = ["tests/"]

[dependencies]
aidaemon-client-protocol = { version = "0.21.0", path = "../client-protocol" }
anyhow = "1"
dirs = { version = "6", optional = true }
base64 = "0.23"
futures = { version = "0.3", optional = true }
p256 = { version = "0.14", features = ["ecdsa"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"], optional = true }
uuid = { version = "1", features = ["v4"] }

# A browser has no OS randomness. Request ids take getrandom's, whose
# backend the page supplies: the app's runtime registers one (NSH does), or
# feature `browser-random` uses the page's `crypto.getRandomValues`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", optional = true }
uuid = { version = "1", features = ["v4", "rng-getrandom"] }

# iOS keeps a paired device's key in the keychain.
[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3"

# Android: the platform verifier needs a Java component the app does not
# ship, so the link trusts the Mozilla root set bundled here instead.
[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = { version = "1", optional = true }

[features]
default = ["native"]
# The tokio link and reqwest sign-in. Without it the
# crate has no I/O and builds for wasm32-unknown-unknown.
native = ["dep:dirs", "dep:futures", "dep:reqwest", "dep:rustls", "dep:rustls-platform-verifier", "dep:tokio", "dep:tokio-tungstenite", "dep:webpki-roots"]
# wasm32 only: randomness from the page's Web Crypto, for a runtime that
# registers no getrandom backend of its own.
browser-random = ["dep:getrandom", "getrandom/wasm_js"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
