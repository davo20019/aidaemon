[package]
name = "aidaemon-client-core"
description = "The shared core of AIdaemon's own clients: the Client Gateway link (reconnect, resume, resend), the event reducer, and sign-in with the local token or a paired device key"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["agent", "client", "websocket"]
categories = ["network-programming"]
exclude = ["tests/"]
publish = false

[dependencies]
aidaemon-client-protocol = { version = "0.2.0", path = "../client-protocol" }
anyhow = "1"
base64 = "0.23"
futures = { version = "0.3", optional = true }
p256 = { version = "0.14", features = ["ecdsa"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.30", features = ["native-tls"], optional = true }
uuid = { version = "1", features = ["v4"] }

# A browser has no OS randomness: the page's `crypto.getRandomValues`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["v4", "js"] }

[features]
default = ["native"]
# The tokio link and reqwest sign-in. Without it the
# crate has no I/O and builds for wasm32-unknown-unknown.
native = ["dep:futures", "dep:reqwest", "dep:tokio", "dep:tokio-tungstenite"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
