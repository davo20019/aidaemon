[package]
name = "aidaemon-store-sqlite"
description = "SQLite run store for aidaemon agents (journal and checkpoints); implementation crate of the aidaemon SDK, no stability promise (use it through aidaemon-sdk)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-store-sqlite"
readme = "README.md"
keywords = ["agent", "sqlite", "llm", "checkpoint", "storage"]
categories = ["database", "asynchronous"]
# Integration tests need dev-dependencies that are not published with the crate;
# planning notes and the API snapshot stay in the repository.
exclude = ["tests/", "benches/"]
publish = false

[features]
# `SqliteApprovalStore`, a durable `aidaemon_channels::ApprovalStore`.
channels = ["dep:aidaemon-channels"]
# `SqliteClientEventLog`, the Client Gateway's durable event log and
# remembered replies.
client-events = []

[dependencies]
aidaemon-channels = { version = "0.2.0", path = "../aidaemon-channels", optional = true }
aidaemon-core = { version = "0.2.0", path = "../aidaemon-core" }
async-trait = "0.1"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"

[dev-dependencies]
aidaemon-channels = { version = "0.2.0", path = "../aidaemon-channels", features = ["conformance"] }
aidaemon-core = { version = "0.2.0", path = "../aidaemon-core", features = ["testing"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
