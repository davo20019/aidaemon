[package]
name = "aidaemon-store-sqlite"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "aidaemon SDK: store-sqlite (experimental)"
repository = "https://github.com/davo20019/aidaemon"
homepage = "https://aidaemon.ai/"
publish = false

[dependencies]
aidaemon-core = { path = "../aidaemon-core" }
async-trait = "0.1"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
thiserror = "1"

[dev-dependencies]
aidaemon-core = { path = "../aidaemon-core", features = ["testing"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
