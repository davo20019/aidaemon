[package]
name = "aidaemon-macros"
description = "The #[tool] attribute macro for aidaemon agents; implementation crate of the aidaemon SDK, no stability promise (use it through aidaemon-sdk)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-macros"
readme = "README.md"
keywords = ["agent", "llm", "tools", "macro", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers"]
exclude = ["tests/"]
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
