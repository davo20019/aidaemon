[package]
name = "aidaemon-skills"
description = "Skills for aidaemon agents: markdown instructions loaded from a directory, matched by trigger, promoted from proven procedures, and the tools that use and manage them; implementation crate of the aidaemon SDK, no stability promise (use it through aidaemon-sdk)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-skills"
readme = "README.md"
keywords = ["agent", "skills", "llm", "tools"]
categories = ["development-tools", "asynchronous"]
# Integration tests need dev-dependencies that are not published with the crate;
# planning notes and the API snapshot stay in the repository.
exclude = ["tests/", "benches/"]
publish = false

[dependencies]
aidaemon-core = { version = "0.2.0", path = "../aidaemon-core" }
aidaemon-memory = { version = "0.2.0", path = "../aidaemon-memory" }
aidaemon-tools = { version = "0.2.0", path = "../aidaemon-tools" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
htmd = "0.5"
llm_readability = "0.0"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "deflate", "brotli", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["sync", "fs", "time"] }
tracing = "0.1"

[dev-dependencies]
aidaemon-tools = { path = "../aidaemon-tools", features = ["testing"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
