[package]
name = "aidaemon-eval"
description = "Scenario-based eval kit for aidaemon agents; implementation crate of the aidaemon SDK, no stability promise (use it through aidaemon-sdk)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-eval"
readme = "README.md"
keywords = ["agent", "eval", "llm", "testing", "scenarios"]
categories = ["development-tools::testing", "development-tools"]
# Integration tests need dev-dependencies that are not published with the crate;
# planning notes and the API snapshot stay in the repository.
exclude = ["tests/", "benches/", "examples/"]

[features]
# Small synthetic tools, a deny-destructive hook and a ready-made factory
# used by the shipped `scenarios/` directory.
examples = []

[dependencies]
aidaemon-core = { version = "0.25.0", path = "../aidaemon-core", features = ["testing"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
thiserror = "2"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
aidaemon-eval = { path = ".", features = ["examples"] }
aidaemon-policies = { path = "../aidaemon-policies", features = ["otel"]}
aidaemon-providers = { path = "../aidaemon-providers" }
# The daemon's context budgeting, for `live_budgeters`.
aidaemon-runtime = { path = "../aidaemon-runtime", features = ["encryption", "testing"]}
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# The shipped scenarios against a live model, one policy on at a time.
aidaemon-channels = { path = "../aidaemon-channels", default-features = false, features = ["checkpoints", "conformance", "http", "testing"] }
aidaemon-decisions = { path = "../aidaemon-decisions", default-features = false, features = ["gemini", "testing", "typesafe"] }
aidaemon-events = { path = "../aidaemon-events", default-features = false, features = ["testing"] }
aidaemon-exposure = { path = "../aidaemon-exposure", default-features = false, features = ["testing"] }
aidaemon-mcp = { path = "../aidaemon-mcp", default-features = false, features = ["registry", "test-server"] }
aidaemon-memory = { path = "../aidaemon-memory", features = ["conformance", "fastembed"] }
aidaemon-secrets = { path = "../aidaemon-secrets", features = ["keychain"] }
aidaemon-shells = { path = "../aidaemon-shells", default-features = false, features = ["tool"] }
aidaemon-surfaces = { path = "../aidaemon-surfaces", default-features = false, features = ["testing", "tool"] }
aidaemon-tools = { path = "../aidaemon-tools", default-features = false, features = ["checkpoints", "docker", "oauth", "testing"] }
aidaemon-work = { path = "../aidaemon-work", default-features = false, features = ["email-trigger", "testing"] }
[[example]]
name = "live_policies"
required-features = ["examples"]

# The daemon's turn on each context budgeter, against a live model.
[[example]]
name = "live_budgeters"
required-features = ["examples"]
