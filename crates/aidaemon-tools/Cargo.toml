[package]
name = "aidaemon-tools"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "aidaemon SDK: tools (experimental)"
repository = "https://github.com/davo20019/aidaemon"
homepage = "https://aidaemon.ai/"
publish = false

[dependencies]
aidaemon-core = { path = "../aidaemon-core" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
globset = "0.4"
htmd = "0.1"
ignore = "0.4"
llm_readability = "0.0"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "deflate", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shellexpand = "3"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["process", "fs", "io-util", "time", "macros", "rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
aidaemon-core = { path = "../aidaemon-core", features = ["testing"] }
tempfile = "3"
tokio = { version = "1", features = ["process", "fs", "io-util", "time", "macros", "rt", "rt-multi-thread", "net", "test-util"] }
