[package]
name = "aidaemon-tools"
description = "Ready-made tools for aidaemon agents (files, search, sandboxed shell, web, checklist); implementation crate of the aidaemon SDK, no stability promise (use it through aidaemon-sdk)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-tools"
readme = "README.md"
keywords = ["agent", "tools", "llm", "shell", "sandbox"]
categories = ["development-tools", "asynchronous"]
publish = false

[dependencies]
aidaemon-core = { version = "0.1.0", path = "../aidaemon-core" }
anyhow = "1"
async-trait = "0.1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
globset = "0.4"
htmd = "0.1"
ignore = "0.4"
llm_readability = "0.0"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "deflate", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shellexpand = "3"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["net", "process", "fs", "io-util", "time", "macros", "rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
aidaemon-core = { path = "../aidaemon-core", features = ["testing"] }
tempfile = "3"
tokio = { version = "1", features = ["net", "process", "fs", "io-util", "time", "macros", "rt", "rt-multi-thread", "net", "test-util"] }
