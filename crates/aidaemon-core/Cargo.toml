[package]
name = "aidaemon-core"
description = "The aidaemon agent kernel: a small, hook-driven agent loop with tools, providers, receipts and resumable state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-core"
readme = "README.md"
keywords = ["agent", "llm", "ai", "hooks", "kernel"]
categories = ["asynchronous", "development-tools"]
publish = false

[features]
# Exposes `aidaemon_core::testing` (ScriptedProvider and helpers) so users can
# test their own tools and hooks without a real model, and
# `aidaemon_core::conformance` (tool and provider conformance kits).
testing = []

[dependencies]
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
aidaemon-core = { path = ".", features = ["testing"] }
tokio = { version = "1", features = ["full", "test-util"] }

[[example]]
name = "quickstart"
required-features = ["testing"]
