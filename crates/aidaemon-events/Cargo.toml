[package]
name = "aidaemon-events"
description = "Immutable event store, payloads and run aggregate; internal to aidaemon, no stability promise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-events"
readme = "README.md"
keywords = ["agent", "events", "event-sourcing", "sqlite", "llm"]
categories = ["database", "asynchronous"]
# Integration tests need dev-dependencies that are not published with the crate;
# planning notes and the API snapshot stay in the repository.
exclude = ["tests/", "benches/"]
publish = false

[features]
# Test-only behaviour that dependents' test builds need, as `cfg(test)` cannot
# reach across a crate boundary.
testing = []

[dependencies]
aidaemon-policies = { version = "0.2.0", path = "../aidaemon-policies" }
aidaemon-tools = { version = "0.2.0", path = "../aidaemon-tools", features = ["checkpoints"] }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strum = { version = "0.27", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
