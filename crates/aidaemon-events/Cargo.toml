[package]
name = "aidaemon-events"
description = "Immutable event store, payloads and run aggregate; internal to aidaemon, no stability promise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-events"
readme = "README.md"
keywords = ["agent", "events", "event-sourcing", "sqlite", "llm"]
categories = ["database", "asynchronous"]
# Integration tests need dev-dependencies that are not published with the crate;
# planning notes and the API snapshot stay in the repository.
exclude = ["tests/", "benches/"]

[features]
# Test-only behaviour that dependents' test builds need, as `cfg(test)` cannot
# reach across a crate boundary.
testing = []

[dependencies]
aidaemon-policies = { version = "0.25.1", path = "../aidaemon-policies" }
aidaemon-tools = { version = "0.25.1", path = "../aidaemon-tools", features = ["checkpoints"] }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
strum = { version = "0.28", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
aidaemon-tools = { path = "../aidaemon-tools", features = ["checkpoints", "docker", "oauth", "testing"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
aidaemon-core = { path = "../aidaemon-core", default-features = false, features = ["testing"] }
aidaemon-events = { path = ".", default-features = false, features = ["testing"] }
aidaemon-policies = { path = "../aidaemon-policies", default-features = false, features = ["otel"] }
aidaemon-secrets = { path = "../aidaemon-secrets", features = ["keychain"] }
