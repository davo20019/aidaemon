[package]
name = "aidaemon-bridge"
description = "A public relay for aidaemon's e-ink access: joins a browser to its owner's daemon and forwards end-to-end encrypted frames it cannot read"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "aidaemon-bridge"
path = "src/main.rs"

[dependencies]
aidaemon-bridge-proto = { version = "=0.25.2", path = "../aidaemon-bridge-proto" }
axum = { version = "0.8", features = ["ws"] }
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
p256 = { version = "0.14", features = ["ecdsa"] }
tokio-tungstenite = "0.30"
