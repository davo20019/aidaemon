[package]
name = "aidaemon-coding-agents"
description = "Coding agents an aidaemon agent hands work to (Claude Code, Codex, ...): the CodingAgent contract, permission modes, and approval hosts that turn an agent's requests into actions the embedding agent judges; implementation crate of the aidaemon SDK, no stability promise (use it through aidaemon-sdk)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-coding-agents"
readme = "README.md"
keywords = ["agent", "coding-agent", "claude-code", "codex", "approvals"]
categories = ["asynchronous", "development-tools"]
exclude = ["tests/", "benches/"]

[features]
# Exposes `peer::PeerMcpHandler` and `peer::PeerMcpContext` backed by
# `aidaemon-mcp`'s local scoped MCP server so any CLI agent can coordinate
# with sibling CLIs over MCP.
mcp = ["dep:aidaemon-mcp"]

[dependencies]
aidaemon-core = { version = "0.25.0", path = "../aidaemon-core" }
aidaemon-secrets = { version = "0.25.0", path = "../aidaemon-secrets", default-features = false }
aidaemon-mcp = { version = "0.25.0", path = "../aidaemon-mcp", optional = true }
async-trait = "0.1"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
aidaemon-mcp = { path = "../aidaemon-mcp", features = ["registry", "test-server"]}
tokio = { version = "1", features = ["full"] }
aidaemon-coding-agents = { path = ".", default-features = false, features = ["mcp"] }
aidaemon-core = { path = "../aidaemon-core", default-features = false, features = ["testing"] }
aidaemon-policies = { path = "../aidaemon-policies", default-features = false, features = ["otel"] }
aidaemon-secrets = { path = "../aidaemon-secrets", features = ["keychain"] }
aidaemon-tools = { path = "../aidaemon-tools", default-features = false, features = ["checkpoints", "docker", "oauth", "testing"] }
