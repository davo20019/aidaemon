[package]
name = "aidaemon-coding-agents"
description = "Coding agents an aidaemon agent hands work to (Claude Code, Codex, ...): the CodingAgent contract, permission modes, and approval hosts that turn an agent's requests into actions the embedding agent judges; implementation crate of the aidaemon SDK, no stability promise (use it through aidaemon-sdk)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-coding-agents"
readme = "README.md"
keywords = ["agent", "coding-agent", "claude-code", "codex", "approvals"]
categories = ["asynchronous", "development-tools"]
exclude = ["tests/", "benches/"]

[dependencies]
aidaemon-core = { version = "0.22.1", path = "../aidaemon-core" }
async-trait = "0.1"
dirs = "7"
serde_json = "1"
shell-words = "1.1"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
