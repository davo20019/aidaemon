[package]
name = "aidaemon-decisions"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "aidaemon SDK: decision backends that answer closed questions with a confidence (experimental)"
repository = "https://github.com/davo20019/aidaemon"
homepage = "https://aidaemon.ai/"
publish = false

[features]
# `GeminiDecider`: Google's Decisions API (`gemini-decision-1`).
gemini = ["dep:reqwest"]
# `ScriptedDecider` and the conformance kit, for testing deciders and callers.
testing = []

[dependencies]
aidaemon-core = { path = "../aidaemon-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[dev-dependencies]
aidaemon-core = { path = "../aidaemon-core", features = ["testing"] }
aidaemon-decisions = { path = ".", features = ["testing", "gemini"] }
tokio = { version = "1", features = ["full"] }
