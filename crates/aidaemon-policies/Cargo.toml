[package]
name = "aidaemon-policies"
description = "Hook-based policies for aidaemon agents: approvals, scope, egress, streak and context-window guards, redaction, untrusted-output handling, tracing; implementation crate of the aidaemon SDK, no stability promise (use it through aidaemon-sdk)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-policies"
readme = "README.md"
keywords = ["agent", "policy", "llm", "guardrails", "hooks"]
categories = ["asynchronous", "development-tools"]
# Integration tests need dev-dependencies that are not published with the crate;
# planning notes and the API snapshot stay in the repository.
exclude = ["tests/", "benches/"]
publish = false

[dependencies]
aidaemon-core = { version = "0.1.0", path = "../aidaemon-core" }
async-trait = "0.1"
regex = "1"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"], optional = true }

[features]
# `OtelSink`: export runs as OpenTelemetry spans.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]

[dev-dependencies]
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "testing"] }
aidaemon-core = { path = "../aidaemon-core", features = ["testing"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
