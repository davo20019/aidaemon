[package]
name = "aidaemon-policies"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "aidaemon SDK: policies (experimental)"
repository = "https://github.com/davo20019/aidaemon"
homepage = "https://aidaemon.ai/"
publish = false

[dependencies]
aidaemon-core = { path = "../aidaemon-core" }
async-trait = "0.1"
regex = "1"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
aidaemon-core = { path = "../aidaemon-core", features = ["testing"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
