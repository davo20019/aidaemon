[package]
name = "aidaemon-sdk"
description = "Build agents in Rust on the aidaemon kernel: one crate, a feature per subsystem (providers, tools, policies, memory, channels)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-sdk"
readme = "README.md"
keywords = ["agent", "llm", "ai", "sdk", "async"]
categories = ["asynchronous", "development-tools"]
publish = false

[features]
default = ["providers", "tools", "policies", "agents", "sqlite"]
providers = ["dep:aidaemon-providers"]
tools = ["dep:aidaemon-tools"]
policies = ["dep:aidaemon-policies"]
agents = ["dep:aidaemon-agents"]
sqlite = ["dep:aidaemon-store-sqlite"]
mcp = ["dep:aidaemon-mcp"]
eval = ["dep:aidaemon-eval"]
memory = ["dep:aidaemon-memory"]
events = ["dep:aidaemon-events"]
work = ["events", "dep:aidaemon-work"]
fastembed = ["memory", "aidaemon-memory/fastembed"]
channels = ["dep:aidaemon-channels"]
telegram = ["channels", "dep:aidaemon-channel-telegram"]
slack = ["channels", "dep:aidaemon-channel-slack"]
discord = ["channels", "dep:aidaemon-channel-discord"]
testing = ["aidaemon-core/testing", "aidaemon-channels?/testing"]
full = ["providers", "tools", "policies", "agents", "sqlite", "mcp", "eval", "testing", "memory", "events", "work", "telegram", "slack", "discord"]

[dependencies]
aidaemon-core = { version = "0.1.0", path = "../aidaemon-core" }
aidaemon-providers = { version = "0.1.0", path = "../aidaemon-providers", optional = true }
aidaemon-tools = { version = "0.1.0", path = "../aidaemon-tools", optional = true }
aidaemon-policies = { version = "0.1.0", path = "../aidaemon-policies", optional = true }
aidaemon-agents = { version = "0.1.0", path = "../aidaemon-agents", optional = true }
aidaemon-store-sqlite = { version = "0.1.0", path = "../aidaemon-store-sqlite", optional = true }
aidaemon-mcp = { version = "0.1.0", path = "../aidaemon-mcp", optional = true }
aidaemon-eval = { version = "0.1.0", path = "../aidaemon-eval", optional = true }
aidaemon-memory = { version = "0.1.0", path = "../aidaemon-memory", optional = true }
aidaemon-events = { version = "0.1.0", path = "../aidaemon-events", optional = true }
aidaemon-work = { version = "0.1.0", path = "../aidaemon-work", optional = true }
aidaemon-channels = { version = "0.1.0", path = "../aidaemon-channels", optional = true }
aidaemon-channel-telegram = { version = "0.1.0", path = "../aidaemon-channel-telegram", optional = true }
aidaemon-channel-slack = { version = "0.1.0", path = "../aidaemon-channel-slack", optional = true }
aidaemon-channel-discord = { version = "0.1.0", path = "../aidaemon-channel-discord", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tempfile = "3"

[[test]]
name = "web_fetch_egress"
required-features = ["tools", "policies", "testing"]

[[example]]
name = "coding_agent"
required-features = ["providers", "tools", "policies", "sqlite"]

[[example]]
name = "support_triage"
required-features = ["providers", "policies"]
