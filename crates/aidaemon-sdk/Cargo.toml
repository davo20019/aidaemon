[package]
name = "aidaemon-sdk"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Build your own agents on the aidaemon kernel: one crate, features per subsystem (experimental)"
repository = "https://github.com/davo20019/aidaemon"
homepage = "https://aidaemon.ai/"
publish = false

[features]
default = ["providers", "tools", "policies", "agents", "sqlite"]
providers = ["dep:aidaemon-providers"]
tools = ["dep:aidaemon-tools"]
policies = ["dep:aidaemon-policies"]
agents = ["dep:aidaemon-agents"]
sqlite = ["dep:aidaemon-store-sqlite"]
mcp = ["dep:aidaemon-mcp"]
eval = ["dep:aidaemon-eval"]
memory = ["dep:aidaemon-memory"]
events = ["dep:aidaemon-events"]
work = ["events", "dep:aidaemon-work"]
fastembed = ["memory", "aidaemon-memory/fastembed"]
channels = ["dep:aidaemon-channels"]
telegram = ["channels", "dep:aidaemon-channel-telegram"]
slack = ["channels", "dep:aidaemon-channel-slack"]
discord = ["channels", "dep:aidaemon-channel-discord"]
testing = ["aidaemon-core/testing", "aidaemon-channels?/testing"]
full = ["providers", "tools", "policies", "agents", "sqlite", "mcp", "eval", "testing", "memory", "events", "work", "telegram", "slack", "discord"]

[dependencies]
aidaemon-core = { path = "../aidaemon-core" }
aidaemon-providers = { path = "../aidaemon-providers", optional = true }
aidaemon-tools = { path = "../aidaemon-tools", optional = true }
aidaemon-policies = { path = "../aidaemon-policies", optional = true }
aidaemon-agents = { path = "../aidaemon-agents", optional = true }
aidaemon-store-sqlite = { path = "../aidaemon-store-sqlite", optional = true }
aidaemon-mcp = { path = "../aidaemon-mcp", optional = true }
aidaemon-eval = { path = "../aidaemon-eval", optional = true }
aidaemon-memory = { path = "../aidaemon-memory", optional = true }
aidaemon-events = { path = "../aidaemon-events", optional = true }
aidaemon-work = { path = "../aidaemon-work", optional = true }
aidaemon-channels = { path = "../aidaemon-channels", optional = true }
aidaemon-channel-telegram = { path = "../aidaemon-channel-telegram", optional = true }
aidaemon-channel-slack = { path = "../aidaemon-channel-slack", optional = true }
aidaemon-channel-discord = { path = "../aidaemon-channel-discord", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tempfile = "3"

[[test]]
name = "web_fetch_egress"
required-features = ["tools", "policies", "testing"]

[[example]]
name = "coding_agent"
required-features = ["providers", "tools", "policies", "sqlite"]

[[example]]
name = "support_triage"
required-features = ["providers", "policies"]
