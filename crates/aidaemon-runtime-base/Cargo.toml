[package]
name = "aidaemon-runtime-base"
description = "The lower half of aidaemon's turn runtime: model runtime and side calls, host traits, authority, sub-agent coordination and runs, memory, history and the state store; internal to aidaemon, no stability promise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-runtime-base"
readme = "README.md"
keywords = ["agent", "llm", "runtime"]
categories = ["asynchronous"]
# Integration tests need dev-dependencies that are not published with the crate;
# planning notes and the API snapshot stay in the repository.
exclude = ["tests/", "benches/"]

[features]
# Test-only helpers that dependents' test builds need, as `cfg(test)` cannot
# reach across a crate boundary.
testing = ["dep:tempfile", "aidaemon-core/testing", "aidaemon-events/testing", "aidaemon-decisions/testing", "aidaemon-tools/testing"]
# SQLCipher: `state::SqliteStateStore` applies a database's encryption key.
# The host links SQLite with SQLCipher (`libsqlite3-sys/bundled-sqlcipher`).
encryption = []

[dependencies]
dunce = "1.0"
aidaemon-agents = { version = "0.25.1", path = "../aidaemon-agents" }
aidaemon-channels = { version = "0.25.1", path = "../aidaemon-channels" }
aidaemon-core = { version = "0.25.1", path = "../aidaemon-core" }
aidaemon-coding-agents = { version = "0.25.1", path = "../aidaemon-coding-agents", features = ["mcp"] }
aidaemon-decisions = { version = "0.25.1", path = "../aidaemon-decisions", features = ["gemini", "typesafe"] }
aidaemon-events = { version = "0.25.1", path = "../aidaemon-events" }
aidaemon-mcp = { version = "0.25.1", path = "../aidaemon-mcp", features = ["registry"] }
aidaemon-memory = { version = "0.25.1", path = "../aidaemon-memory" }
aidaemon-nodes = { version = "0.25.1", path = "../aidaemon-nodes" }
aidaemon-policies = { version = "0.25.1", path = "../aidaemon-policies" }
aidaemon-skills = { version = "0.25.1", path = "../aidaemon-skills" }
aidaemon-providers = { version = "0.25.1", path = "../aidaemon-providers", features = ["chatgpt-login"] }
aidaemon-store-sqlite = { version = "0.25.1", path = "../aidaemon-store-sqlite" }
aidaemon-tools = { version = "0.25.1", path = "../aidaemon-tools", features = ["oauth", "sqlite"] }
aidaemon-secrets = { version = "0.25.1", path = "../aidaemon-secrets", default-features = false }
aidaemon-work = { version = "0.25.1", path = "../aidaemon-work" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures = "0.3"
regex = "1"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
sha2 = "0.11"
hex = "0.4"
shellexpand = "3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "process"] }
tokio-util = "0.7.20"
tracing = "0.1"
toml = "1.2"
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
aidaemon-core = { path = "../aidaemon-core", features = ["testing"] }
aidaemon-decisions = { path = "../aidaemon-decisions", features = ["testing", "gemini", "typesafe"] }
aidaemon-events = { path = "../aidaemon-events", features = ["testing"] }
aidaemon-tools = { path = "../aidaemon-tools", features = ["checkpoints", "docker", "oauth", "testing"] }
aidaemon-channels = { path = "../aidaemon-channels", features = ["checkpoints", "conformance", "http", "testing"] }
aidaemon-work = { path = "../aidaemon-work", features = ["email-trigger", "testing"] }
aidaemon-memory = { path = "../aidaemon-memory", features = ["conformance", "fastembed"] }
axum = "0.8"
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
aidaemon-exposure = { path = "../aidaemon-exposure", default-features = false, features = ["testing"] }
aidaemon-mcp = { path = "../aidaemon-mcp", default-features = false, features = ["registry", "test-server"] }
aidaemon-policies = { path = "../aidaemon-policies", default-features = false, features = ["otel"] }
aidaemon-runtime-base = { path = ".", default-features = false, features = ["encryption", "testing"] }
aidaemon-secrets = { path = "../aidaemon-secrets", features = ["keychain"] }
aidaemon-shells = { path = "../aidaemon-shells", default-features = false, features = ["tool"] }
aidaemon-surfaces = { path = "../aidaemon-surfaces", default-features = false, features = ["testing", "tool"] }
aidaemon-store-sqlite = { path = "../aidaemon-store-sqlite", default-features = false, features = ["client-events"] }
