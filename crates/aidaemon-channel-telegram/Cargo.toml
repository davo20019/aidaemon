[package]
name = "aidaemon-channel-telegram"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "aidaemon SDK: telegram channel adapter (experimental)"
repository = "https://github.com/davo20019/aidaemon"
homepage = "https://aidaemon.ai/"
publish = false

[dependencies]
aidaemon-channels = { path = "../aidaemon-channels" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
aidaemon-channels = { path = "../aidaemon-channels", features = ["conformance"] }
axum = "0.8"
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "time", "net"] }
