[package]
name = "aidaemon-channel-telegram"
description = "Telegram adapter for aidaemon channels; implementation crate of the aidaemon SDK, no stability promise (use it through aidaemon-sdk)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-channel-telegram"
readme = "README.md"
keywords = ["telegram", "bot", "agent", "chat", "llm"]
categories = ["asynchronous", "network-programming"]
# Integration tests need dev-dependencies that are not published with the crate;
# planning notes and the API snapshot stay in the repository.
exclude = ["tests/", "benches/"]
publish = false

[features]
## Receive updates on an HTTPS webhook instead of long polling.
webhook = ["dep:axum", "dep:rand", "tokio/net"]
## The bot an application runs (`bot::TelegramBot`): access, sessions,
## commands, files and the live status card on the shared turn runner.
bot = [
    "webhook",
    "dep:aidaemon-core",
    "dep:aidaemon-events",
    "dep:aidaemon-tools",
    "dep:anyhow",
    "dep:uuid",
]
## The terminal surface (`terminal::TelegramTerminal`): `/agent` and
## `/terminal` with the terminal Mini App, share and resume codes, and
## terminal lite.
terminal = [
    "bot",
    "dep:base64",
    "dep:hmac",
    "dep:rand",
    "dep:sha2",
    "dep:shell-words",
]

[dependencies]
aidaemon-channels = { version = "0.20.0", path = "../aidaemon-channels", features = ["http"] }
aidaemon-core = { version = "0.20.0", path = "../aidaemon-core", optional = true }
aidaemon-events = { version = "0.20.0", path = "../aidaemon-events", optional = true }
aidaemon-tools = { version = "0.20.0", path = "../aidaemon-tools", optional = true }
anyhow = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio"] }
rand = { version = "0.10", optional = true }
base64 = { version = "0.23", optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
shell-words = { version = "1.1", optional = true }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
proptest = "1"
aidaemon-channels = { path = "../aidaemon-channels", features = ["conformance"] }
aidaemon-core = { path = "../aidaemon-core", features = ["testing"] }
axum = "0.8"
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "time", "net"] }
