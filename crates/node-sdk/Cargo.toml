[package]
name = "aidaemon-node-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust client SDK for AIdaemon Nodes"
repository = "https://github.com/davo20019/aidaemon"
homepage = "https://aidaemon.ai/"

[dependencies]
aidaemon-node-protocol = { version = "0.1.0", path = "../node-protocol" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
