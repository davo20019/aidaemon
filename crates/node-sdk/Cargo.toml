[package]
name = "aidaemon-node-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust client SDK for AIdaemon Nodes"
repository = "https://github.com/davo20019/aidaemon"
homepage = "https://aidaemon.ai/"

[dependencies]
aidaemon-node-protocol = { version = "0.1.0", path = "../node-protocol" }
anyhow = "1"
base64 = "0.23"
p256 = { version = "0.14", features = ["ecdsa"] }
rand = "0.10"
reqwest = { version = "0.13", features = ["json", "query", "rustls"], default-features = false }
uuid = { version = "1", features = ["v4"] }
