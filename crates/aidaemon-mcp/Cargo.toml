[package]
name = "aidaemon-mcp"
description = "Model Context Protocol client that exposes MCP server tools to aidaemon agents; implementation crate of the aidaemon SDK, no stability promise (use it through aidaemon-sdk)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-mcp"
readme = "README.md"
keywords = ["mcp", "agent", "llm", "tools", "async"]
categories = ["asynchronous", "api-bindings"]
# Integration tests need dev-dependencies that are not published with the crate;
# planning notes and the API snapshot stay in the repository.
exclude = ["tests/", "benches/"]
publish = false

[features]
# Builds `fake_mcp_server`, a tiny scripted MCP server used by this crate's
# tests (and handy for testing your own MCP integrations offline).
test-server = []
# The registry of running servers (`registry::McpRegistry`): their tools as
# `aidaemon-tools` tools, environment values in a `SecretStore`.
registry = ["dep:aidaemon-tools", "dep:aidaemon-secrets", "dep:tracing"]

[dependencies]
aidaemon-core = { version = "0.2.0", path = "../aidaemon-core" }
aidaemon-secrets = { version = "0.2.0", path = "../aidaemon-secrets", default-features = false, optional = true }
aidaemon-tools = { version = "0.2.0", path = "../aidaemon-tools", optional = true }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", optional = true }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt"] }

[dev-dependencies]
aidaemon-core = { path = "../aidaemon-core", features = ["testing"] }
# Enables the fake server binary for integration tests.
aidaemon-mcp = { path = ".", features = ["test-server", "registry"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt", "rt-multi-thread"] }

[[bin]]
name = "fake_mcp_server"
path = "src/bin/fake_mcp_server.rs"
required-features = ["test-server"]
