[package]
name = "aidaemon-channels"
description = "Chat channel contract and the runner that connects channels to aidaemon agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-channels"
readme = "README.md"
keywords = ["agent", "chat", "channel", "llm", "async"]
categories = ["asynchronous", "network-programming"]
# Integration tests need dev-dependencies that are not published with the crate;
# planning notes and the API snapshot stay in the repository.
exclude = ["tests/", "benches/"]
publish = false

[features]
# Exposes `aidaemon_channels::testing::TestChannel` for adapter and app tests.
testing = []
# Exposes `aidaemon_channels::conformance`, the channel conformance kit for
# adapter authors (implies `testing` for the TestChannel reference harness).
conformance = ["testing", "aidaemon-core/testing"]
# Exposes `aidaemon_channels::download`, the bounded downloader the HTTP-based
# adapters share.
http = ["dep:reqwest"]
# `/checkpoints` and `/rollback` (`admin_commands::CheckpointCommands`) over
# aidaemon-tools' filesystem checkpoints.
checkpoints = ["aidaemon-tools/checkpoints"]

[dependencies]
aidaemon-core = { version = "0.20.0", path = "../aidaemon-core" }
aidaemon-tools = { version = "0.20.0", path = "../aidaemon-tools" }
aidaemon-events = { version = "0.20.0", path = "../aidaemon-events" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.23"
regex = "1"
reqwest = { version = "0.13", default-features = false, optional = true }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3"
dirs = "7"
shell-words = "1.1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
dirs = "7"
aidaemon-tools = { path = "../aidaemon-tools", features = ["testing"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
toml = "1.2"
tempfile = "3"
aidaemon-core = { path = "../aidaemon-core", features = ["testing"] }
aidaemon-channels = { path = ".", features = ["testing", "conformance", "http"] }
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["full"] }
