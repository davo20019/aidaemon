[package]
name = "aidaemon-channels"
description = "Chat channel contract and the runner that connects channels to aidaemon agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-channels"
readme = "README.md"
keywords = ["agent", "chat", "channel", "llm", "async"]
categories = ["asynchronous", "network-programming"]
# Integration tests need dev-dependencies that are not published with the crate;
# planning notes and the API snapshot stay in the repository.
exclude = ["tests/", "benches/"]
publish = false

[features]
# Exposes `aidaemon_channels::testing::TestChannel` for adapter and app tests.
testing = []
# Exposes `aidaemon_channels::conformance`, the channel conformance kit for
# adapter authors (implies `testing` for the TestChannel reference harness).
conformance = ["testing", "aidaemon-core/testing"]
# Exposes `aidaemon_channels::download`, the bounded downloader the HTTP-based
# adapters share.
http = ["dep:reqwest"]

[dependencies]
aidaemon-core = { version = "0.2.0", path = "../aidaemon-core" }
aidaemon-tools = { version = "0.2.0", path = "../aidaemon-tools" }
aidaemon-events = { version = "0.2.0", path = "../aidaemon-events" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"
regex = "1"
reqwest = { version = "0.12", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
toml = "0.8"
tempfile = "3"
aidaemon-core = { path = "../aidaemon-core", features = ["testing"] }
aidaemon-channels = { path = ".", features = ["testing", "conformance", "http"] }
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["full"] }
