[package]
name = "aidaemon-runtime"
description = "aidaemon's turn runtime: the built-in tools and the agent on top of aidaemon-runtime-core, whose modules it re-exports; internal to aidaemon, no stability promise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-runtime"
readme = "README.md"
keywords = ["agent", "llm", "runtime"]
categories = ["asynchronous"]
# Integration tests need dev-dependencies that are not published with the crate;
# planning notes and the API snapshot stay in the repository.
exclude = ["tests/", "benches/"]

[features]
# Test-only helpers that dependents' test builds need, as `cfg(test)` cannot
# reach across a crate boundary.
testing = ["dep:tempfile", "aidaemon-runtime-core/testing", "aidaemon-core/testing", "aidaemon-events/testing", "aidaemon-decisions/testing", "aidaemon-tools/testing"]
# SQLCipher: `state::SqliteStateStore` applies a database's encryption key.
# The host links SQLite with SQLCipher (`libsqlite3-sys/bundled-sqlcipher`).
encryption = ["aidaemon-runtime-core/encryption"]
# The `computer_use` tool (desktop apps through accessibility and screenshots).
computer_use = []
# Its macOS harness (accessibility, window capture, input).
computer_use-macos = ["computer_use", "dep:axuielement", "dep:xcap", "dep:enigo", "dep:image", "dep:aidaemon-surfaces"]

[dependencies]
# Everything but tools/ and agent/, re-exported at this crate's root (lib.rs):
# split out so an edit to a tool recompiles this crate, not the whole runtime.
aidaemon-runtime-core = { version = "0.25.2", path = "../aidaemon-runtime-core" }
dunce = "1.0"
aidaemon-channels = { version = "0.25.2", path = "../aidaemon-channels" }
aidaemon-client-gateway = { version = "0.25.2", path = "../aidaemon-client-gateway" }
aidaemon-core = { version = "0.25.2", path = "../aidaemon-core" }
aidaemon-coding-agents = { version = "0.25.2", path = "../aidaemon-coding-agents", features = ["mcp"] }
aidaemon-decisions = { version = "0.25.2", path = "../aidaemon-decisions", features = ["gemini", "typesafe"] }
aidaemon-events = { version = "0.25.2", path = "../aidaemon-events" }
aidaemon-exposure = { version = "0.25.2", path = "../aidaemon-exposure" }
aidaemon-mcp = { version = "0.25.2", path = "../aidaemon-mcp", features = ["registry"] }
aidaemon-memory = { version = "0.25.2", path = "../aidaemon-memory" }
aidaemon-policies = { version = "0.25.2", path = "../aidaemon-policies" }
aidaemon-skills = { version = "0.25.2", path = "../aidaemon-skills" }
aidaemon-providers = { version = "0.25.2", path = "../aidaemon-providers", features = ["chatgpt-login"] }
aidaemon-store-sqlite = { version = "0.25.2", path = "../aidaemon-store-sqlite" }
aidaemon-surfaces = { version = "0.25.2", path = "../aidaemon-surfaces", optional = true }
aidaemon-tools = { version = "0.25.2", path = "../aidaemon-tools", features = ["oauth"] }
aidaemon-secrets = { version = "0.25.2", path = "../aidaemon-secrets", default-features = false }
aidaemon-work = { version = "0.25.2", path = "../aidaemon-work" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures = "0.3"
regex = "1"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
libc = "0.2"
shell-words = "1.1"
# 0.38: sysinfo 0.39 and later need rustc 1.95, past the SDK crates' MSRV (1.94).
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
shellexpand = "3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "process"] }
tokio-util = "0.7.20"
tracing = "0.1"
toml = "1.2"
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[target.'cfg(target_os = "macos")'.dependencies]
axuielement = { version = "0.10", optional = true }
enigo = { version = "0.6", optional = true }
xcap = { version = "0.9", optional = true }
# JPEG frames for the desktop's live view (the same image crate xcap uses).
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }

[dev-dependencies]
aidaemon-core = { path = "../aidaemon-core", features = ["testing"] }
aidaemon-decisions = { path = "../aidaemon-decisions", features = ["testing", "gemini", "typesafe"] }
aidaemon-events = { path = "../aidaemon-events", features = ["testing"] }
aidaemon-tools = { path = "../aidaemon-tools", features = ["checkpoints", "docker", "oauth", "testing"] }
aidaemon-channels = { path = "../aidaemon-channels", features = ["checkpoints", "conformance", "http", "testing"] }
aidaemon-work = { path = "../aidaemon-work", features = ["email-trigger", "testing"] }
aidaemon-memory = { path = "../aidaemon-memory", features = ["conformance", "fastembed"] }
axum = "0.8"
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
aidaemon-exposure = { path = "../aidaemon-exposure", default-features = false, features = ["testing"] }
aidaemon-mcp = { path = "../aidaemon-mcp", default-features = false, features = ["registry", "test-server"] }
aidaemon-policies = { path = "../aidaemon-policies", default-features = false, features = ["otel"] }
aidaemon-runtime = { path = ".", default-features = false, features = ["encryption", "testing"] }
aidaemon-secrets = { path = "../aidaemon-secrets", features = ["keychain"] }
aidaemon-shells = { path = "../aidaemon-shells", default-features = false, features = ["tool"] }
aidaemon-surfaces = { path = "../aidaemon-surfaces", default-features = false, features = ["testing", "tool"] }
