[package]
name = "aidaemon-runtime"
description = "aidaemon's turn runtime: model routing and side calls, budgets, and the turn on top of the aidaemon-core kernel; internal to aidaemon, no stability promise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-runtime"
readme = "README.md"
keywords = ["agent", "llm", "runtime"]
categories = ["asynchronous"]
# Integration tests need dev-dependencies that are not published with the crate;
# planning notes and the API snapshot stay in the repository.
exclude = ["tests/", "benches/"]
publish = false

[features]
# Test-only helpers that dependents' test builds need, as `cfg(test)` cannot
# reach across a crate boundary.
testing = ["dep:tempfile", "aidaemon-core/testing", "aidaemon-events/testing", "aidaemon-decisions/testing"]
# SQLCipher: `state::SqliteStateStore` applies a database's encryption key.
# The host links SQLite with SQLCipher (`libsqlite3-sys/bundled-sqlcipher`).
encryption = []
# The `computer_use` tool (desktop apps through accessibility and screenshots).
computer_use = []
# Its macOS harness (accessibility, window capture, input).
computer_use-macos = ["computer_use", "dep:axuielement", "dep:xcap", "dep:enigo"]

[dependencies]
aidaemon-agents = { version = "0.2.0", path = "../aidaemon-agents" }
aidaemon-channels = { version = "0.2.0", path = "../aidaemon-channels" }
aidaemon-client-gateway = { version = "0.2.0", path = "../aidaemon-client-gateway" }
aidaemon-core = { version = "0.2.0", path = "../aidaemon-core" }
aidaemon-decisions = { version = "0.2.0", path = "../aidaemon-decisions", features = ["gemini"] }
aidaemon-events = { version = "0.2.0", path = "../aidaemon-events" }
aidaemon-exposure = { version = "0.2.0", path = "../aidaemon-exposure" }
aidaemon-mcp = { version = "0.2.0", path = "../aidaemon-mcp" }
aidaemon-memory = { version = "0.2.0", path = "../aidaemon-memory" }
aidaemon-nodes = { version = "0.2.0", path = "../aidaemon-nodes" }
aidaemon-policies = { version = "0.2.0", path = "../aidaemon-policies" }
aidaemon-skills = { version = "0.2.0", path = "../aidaemon-skills" }
aidaemon-providers = { version = "0.2.0", path = "../aidaemon-providers", features = ["chatgpt-login"] }
aidaemon-store-sqlite = { version = "0.2.0", path = "../aidaemon-store-sqlite" }
aidaemon-tools = { version = "0.2.0", path = "../aidaemon-tools", features = ["oauth"] }
aidaemon-secrets = { version = "0.2.0", path = "../aidaemon-secrets", default-features = false }
aidaemon-work = { version = "0.2.0", path = "../aidaemon-work" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures = "0.3"
regex = "1"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
libc = "0.2"
shell-words = "1.1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
shellexpand = "3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "process"] }
tokio-util = "0.7.20"
tracing = "0.1"
toml = "1.2"
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
axuielement = { version = "0.10", optional = true }
enigo = { version = "0.6", optional = true }
xcap = { version = "0.9", optional = true }

[dev-dependencies]
aidaemon-core = { path = "../aidaemon-core", features = ["testing"] }
aidaemon-decisions = { path = "../aidaemon-decisions", features = ["testing", "gemini"] }
aidaemon-events = { path = "../aidaemon-events", features = ["testing"] }
aidaemon-tools = { path = "../aidaemon-tools", features = ["testing"] }
aidaemon-channels = { path = "../aidaemon-channels", features = ["testing"] }
aidaemon-work = { path = "../aidaemon-work", features = ["testing"] }
aidaemon-memory = { path = "../aidaemon-memory", features = ["fastembed", "testing"] }
axum = "0.8"
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
