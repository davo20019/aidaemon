[package]
name = "aidaemon-channel-discord"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "aidaemon SDK: discord channel adapter (experimental)"
repository = "https://github.com/davo20019/aidaemon"
homepage = "https://aidaemon.ai/"
publish = false

[features]
# zlib-stream transport compression (`DiscordChannel::with_zlib_compression`).
# tokio-tungstenite has no inflate of its own, so this is the crate's one
# optional dependency; a build without the feature connects uncompressed.
zlib = ["dep:flate2"]

[dependencies]
aidaemon-channels = { path = "../aidaemon-channels", features = ["http"] }
async-trait = "0.1"
flate2 = { version = "1", optional = true }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "net"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
aidaemon-channels = { path = "../aidaemon-channels", features = ["conformance"] }
aidaemon-core = { path = "../aidaemon-core", features = ["testing"] }
flate2 = "1"
tokio = { version = "1", features = ["full"] }
