[package]
name = "aidaemon-memory"
description = "Swappable long-term memory for aidaemon agents: the MemoryStore traits plus SQLite and embedding implementations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-memory"
readme = "README.md"
keywords = ["agent", "memory", "llm", "embeddings", "sqlite"]
categories = ["asynchronous", "database"]
publish = false

[features]
default = []
# Local ONNX embeddings (AllMiniLM-L6-v2) via fastembed. Downloads the model
# on first use, so it is off by default; `HashEmbedder` works offline.
fastembed = ["dep:fastembed"]
# Exposes `aidaemon_memory::conformance`, the `MemoryStore` conformance kit
# for authors of custom stores.
conformance = ["aidaemon-core/testing"]

[dependencies]
aidaemon-core = { version = "0.1.0", path = "../aidaemon-core" }
aidaemon-policies = { version = "0.1.0", path = "../aidaemon-policies" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
fastembed = { version = "4", optional = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
aidaemon-core = { path = "../aidaemon-core", features = ["testing"] }
aidaemon-memory = { path = ".", features = ["conformance"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
