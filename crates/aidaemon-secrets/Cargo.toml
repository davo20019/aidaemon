[package]
name = "aidaemon-secrets"
description = "Secret storage for aidaemon agents: a SecretStore trait over the OS keychain, an env-file mode and an in-memory store for tests; implementation crate of the aidaemon SDK, no stability promise (use it through aidaemon-sdk)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aidaemon-secrets"
readme = "README.md"
keywords = ["agent", "secrets", "keychain", "credentials"]
categories = ["authentication", "config"]
# Integration tests need dev-dependencies that are not published with the crate;
# planning notes and the API snapshot stay in the repository.
exclude = ["tests/", "benches/"]
publish = false

[features]
default = ["keychain"]
# The OS credential store (macOS Keychain, Secret Service, Windows Credential Manager).
keychain = ["dep:keyring"]

[dependencies]
anyhow = "1"
dotenvy = "0.15"

# keyring v4 dropped feature flags and moved `Entry` to `keyring-core`; staying
# on v3 until that migration is scoped separately.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"], optional = true }

[dev-dependencies]
tempfile = "3"
