# cargo-nextest settings. Only the Windows CI job uses nextest for now: one
# process per test, so a test that hangs there fails on its own instead of
# holding the whole run until the job's time limit.

[profile.windows-ci]
# Report every failure, not just the first.
fail-fast = false
# A test still running after 20 s is reported as slow; after 120 s it is
# stopped and fails.
slow-timeout = { period = "20s", terminate-after = 6 }
# Each failure's output as it happens, so a cancelled run still shows why.
failure-output = "immediate"
# Slow tests too: on Windows some take 30 s where they take under one
# elsewhere.
status-level = "slow"
