# cargo-nextest settings. Only the Windows CI job uses nextest for now: one
# process per test, so a test that hangs there fails on its own instead of
# holding the whole run until the job's time limit.

[profile.windows-ci]
# Report every failure, not just the first.
fail-fast = false
# A test still running after 60 s is reported as slow; after 120 s it is
# stopped and fails.
slow-timeout = { period = "60s", terminate-after = 2 }
failure-output = "final"
status-level = "fail"
