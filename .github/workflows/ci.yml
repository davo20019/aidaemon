name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CODEX_CLI_VERSION: "0.151.0"
  # Debug-profile async state machines on the agent loop are deep; libtest's
  # default 2 MiB test-thread stack sits within a few percent of what the
  # integration suite needs. Match the daemon's own worker stack budget.
  RUST_MIN_STACK: "8388608"

jobs:
  release-tag-guard:
    name: Release tag guard
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure release commits are tagged
        run: |
          set -euo pipefail

          SUBJECT="$(git log -1 --pretty=%s "$GITHUB_SHA")"
          TAG_NAME="$(printf '%s\n' "$SUBJECT" | sed -nE 's/^release: (v[0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"

          if [ -z "$TAG_NAME" ]; then
            echo "HEAD commit is not a release commit; skipping tag guard."
            exit 0
          fi

          if git tag --points-at "$GITHUB_SHA" | grep -Fxq "$TAG_NAME"; then
            echo "Found matching tag ${TAG_NAME} on ${GITHUB_SHA}."
            exit 0
          fi

          # The documented release flow (CLAUDE.md "Release Notes") pushes the
          # release commit first, waits for CI to pass, then pushes the tag. So a
          # fresh release commit legitimately reaches master moments before its
          # tag exists. Allow a grace window so normal releases don't flash a
          # transient failure; only hard-fail once a release commit has lingered
          # untagged past the window (re-run this job after pushing the tag to
          # turn it green).
          GRACE_SECONDS=5400  # 90 minutes
          COMMIT_EPOCH="$(git log -1 --format=%ct "$GITHUB_SHA")"
          NOW_EPOCH="$(date -u +%s)"
          AGE=$(( NOW_EPOCH - COMMIT_EPOCH ))

          if [ "$AGE" -lt "$GRACE_SECONDS" ]; then
            echo "::notice::Release commit '${SUBJECT}' has no '${TAG_NAME}' tag yet (commit is ${AGE}s old, within the ${GRACE_SECONDS}s grace window). Push it with 'git push origin ${TAG_NAME}', then re-run this job to confirm."
            exit 0
          fi

          echo "::error::Release commit '${SUBJECT}' reached master without matching tag '${TAG_NAME}' pointing at ${GITHUB_SHA} (untagged for ${AGE}s, past the ${GRACE_SECONDS}s grace window)."
          echo "Tags currently pointing at ${GITHUB_SHA}:"
          git tag --points-at "$GITHUB_SHA" || true
          exit 1

  check:
    name: Check (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-check-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-check-v2-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Clippy (SDK crates)
        run: >-
          cargo clippy -p aidaemon-core -p aidaemon-providers -p aidaemon-tools
          -p aidaemon-store-sqlite -p aidaemon-mcp -p aidaemon-agents
          -p aidaemon-policies -p aidaemon-eval -p aidaemon-sdk -p aidaemon-macros -p aidaemon-memory
          -p aidaemon-events -p aidaemon-work -p aidaemon-decisions
          -p aidaemon-channels -p aidaemon-channel-telegram -p aidaemon-channel-slack
          -p aidaemon-channel-discord
          --all-targets --all-features -- -D warnings

  core-api:
    name: Core public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned together: cargo-public-api reads rustdoc JSON, whose format
      # changes between nightlies. Bump both deliberately.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.52.0

      - name: Diff aidaemon-core public API against the snapshot
        run: scripts/check-core-api.sh

  # Docs must build without warnings for every SDK crate, one crate at a time
  # (a workspace-wide `cargo doc` unifies features and hides per-crate breakage).
  sdk-docs:
    name: SDK docs (-D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-docs-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-docs-v1-

      - name: cargo doc per crate
        run: |
          set -euo pipefail
          for crate in aidaemon-core aidaemon-providers aidaemon-tools \
            aidaemon-store-sqlite aidaemon-mcp aidaemon-agents aidaemon-policies \
            aidaemon-eval aidaemon-memory aidaemon-decisions aidaemon-events \
            aidaemon-work aidaemon-channels aidaemon-channel-telegram \
            aidaemon-channel-slack aidaemon-channel-discord aidaemon-macros aidaemon-sdk; do
            echo "::group::cargo doc $crate"
            cargo doc --no-deps --all-features -p "$crate"
            echo "::endgroup::"
          done

  # The SDK crates declare `rust-version` in [workspace.package]. This job
  # builds them on exactly that toolchain, read from the manifest so the two
  # cannot drift. Library targets only: dev-dependencies may need newer Rust.
  msrv:
    name: MSRV (SDK crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read rust-version
        id: msrv
        run: |
          v="$(sed -nE 's/^rust-version = "([0-9.]+)"/\1/p' Cargo.toml | head -1)"
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-msrv-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-v1-

      - name: cargo check on the MSRV
        run: >-
          cargo check --locked --all-features
          -p aidaemon-core -p aidaemon-providers -p aidaemon-tools
          -p aidaemon-store-sqlite -p aidaemon-mcp -p aidaemon-agents
          -p aidaemon-policies -p aidaemon-eval -p aidaemon-memory
          -p aidaemon-decisions -p aidaemon-events -p aidaemon-work
          -p aidaemon-channels -p aidaemon-channel-telegram
          -p aidaemon-channel-slack -p aidaemon-channel-discord -p aidaemon-macros
          -p aidaemon-sdk

  # Semver check of the public-contract tier against the last published
  # version on crates.io. Before the first publish there is no baseline, so a
  # crate that is not on crates.io yet is skipped with a notice instead of
  # failing; once 0.1.0 is out the check is live with no workflow change.
  semver:
    name: Semver (public contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev

      - name: Check each public-contract crate
        run: |
          set -euo pipefail
          # aidaemon-channels and aidaemon-memory are in the tier by their
          # `channel` module and traits; the check covers the whole crate.
          for crate in aidaemon-core aidaemon-sdk aidaemon-channels aidaemon-memory; do
            status="$(curl -s -o /dev/null -w '%{http_code}' \
              -A 'aidaemon-ci (https://github.com/davo20019/aidaemon)' \
              "https://crates.io/api/v1/crates/$crate")"
            if [ "$status" = "404" ]; then
              echo "::notice::$crate is not on crates.io yet; no semver baseline, skipping."
              continue
            elif [ "$status" != "200" ]; then
              echo "::error::crates.io lookup for $crate returned HTTP $status"
              exit 1
            fi
            cargo semver-checks check-release -p "$crate"
          done

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev

      - name: Install Codex sandbox adapter
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm install --global "@openai/codex@${CODEX_CLI_VERSION}"
          codex --version

      - name: Configure Linux sandbox namespaces
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg

      - name: Free disk space (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-test-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-v2-

      - name: Cache fastembed model
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-allminilml6v2-v2

      - name: Run tests
        run: cargo test --all-features

      - name: Harness eval fixture suite
        run: cargo test --lib harness_eval --all-features

      - name: SDK crate tests
        run: >-
          cargo test -p aidaemon-core -p aidaemon-providers -p aidaemon-tools
          -p aidaemon-store-sqlite -p aidaemon-mcp -p aidaemon-agents
          -p aidaemon-policies -p aidaemon-eval -p aidaemon-sdk -p aidaemon-macros -p aidaemon-memory
          -p aidaemon-events -p aidaemon-work -p aidaemon-decisions
          -p aidaemon-channels -p aidaemon-channel-telegram -p aidaemon-channel-slack
          -p aidaemon-channel-discord --all-features

      # Each example runs against the scripted provider when no API key is
      # set (CI sets none), and against a live model when one is.
      - name: SDK examples (scripted)
        shell: bash
        run: |
          set -euo pipefail
          unset ANTHROPIC_API_KEY OPENAI_API_KEY
          for example in quickstart custom_tool approvals resume_after_crash sub_agent \
              memory_swap channel_bot sse_server otel_traces support_triage; do
            echo "::group::$example"
            cargo run -q -p aidaemon-sdk --all-features --example "$example"
            echo "::endgroup::"
          done
          cargo run -q -p aidaemon-core --features testing --example kernel_tour

  build-check:
    name: Build check (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-v2-

      - name: Build release
        run: cargo build --release --features "browser"

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    continue-on-error: true  # Visibility only — doesn't block merges
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev

      - name: Install Codex sandbox adapter
        run: |
          npm install --global "@openai/codex@${CODEX_CLI_VERSION}"
          codex --version

      - name: Configure Linux sandbox namespaces
        run: |
          set -euo pipefail
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-cov-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cov-v2-

      - name: Cache fastembed model
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-allminilml6v2-v2

      - name: Generate coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
