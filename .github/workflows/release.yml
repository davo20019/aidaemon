name: Release

# A tag with a suffix (v0.20.0-rc.1) is a rehearsal: every build runs, the
# release is a draft prerelease, and nothing is published to crates.io or
# Homebrew. Delete the draft and the tag afterwards.
on:
  push:
    tags:
      - 'v*'
  # tag-release.yml starts it on the tag it creates (its token's tag push
  # starts no workflow); run it on a tag ref.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CODEX_CLI_VERSION: "0.151.0"
  # The app (clients/app) toolchain: the web bundle needs the nsh CLI and the
  # wasm-bindgen CLI matching the app's wasm-bindgen crate.
  NSH_VERSION: "0.6.1"
  NSH_LINUX_SHA256: "9a7ac692f1c229df476be8ff83a3c5912d271453b644e313f02cb19d18696070"
  NSH_MACOS_SHA256: "ee1aed2a4d111fe90e6cceca4b9d5f834c9e11cfda525f8be984261a329c06de"
  WASM_BINDGEN_CLI_VERSION: "0.2.130"
  # Debug-profile async state machines on the agent loop are deep; libtest's
  # default 2 MiB test-thread stack sits within a few percent of what the
  # integration suite needs. Match the daemon's own worker stack budget.
  RUST_MIN_STACK: "8388608"

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      # CI already ran every test on this exact commit (the pull request or
      # the master push): reuse its result instead of spending most of an
      # hour repeating it. A commit no CI run passed gets the full suite here.
      - name: Find a passing CI run for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=20" \
              -q '[.workflow_runs[] | {status, conclusion}]')"
            if echo "$runs" | jq -e 'any(.conclusion == "success")' >/dev/null; then
              echo "CI passed on ${GITHUB_SHA}; skipping the test rerun."
              echo "green=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A run still going on this commit (master pushed with the tag):
            # wait for it rather than repeating it.
            if ! echo "$runs" | jq -e 'any(.status != "completed")' >/dev/null; then
              break
            fi
            sleep 60
          done
          echo "::notice::No passing CI run on ${GITHUB_SHA}; running the test suite here."
          echo "green=false" >> "$GITHUB_OUTPUT"

      # The toolchain (and clippy/rustfmt) comes from rust-toolchain.toml.
      - name: Install Rust
        if: steps.ci.outputs.green != 'true'
        run: rustup toolchain install && rustc --version

      - name: Install Linux dependencies
        if: steps.ci.outputs.green != 'true'
        uses: ./.github/actions/apt-install
        with:
          packages: libdbus-1-dev pkg-config libssl-dev

      - name: Install Codex sandbox adapter
        if: steps.ci.outputs.green != 'true'
        run: |
          npm install --global "@openai/codex@${CODEX_CLI_VERSION}"
          codex --version

      - name: Configure Linux sandbox namespaces
        if: steps.ci.outputs.green != 'true'
        run: |
          set -euo pipefail
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Free disk space
        if: steps.ci.outputs.green != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Cache cargo registry
        if: steps.ci.outputs.green != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-gate-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-gate-v2-

      - name: Cache fastembed model
        if: steps.ci.outputs.green != 'true'
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-allminilml6v2-v2

      - name: Run tests
        if: steps.ci.outputs.green != 'true'
        run: cargo test --all-features

  build:
    name: Build ${{ matrix.name }}
    needs: [quality-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04 for GTK 4.14, which the app's desktop backend needs.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            name: linux-x86_64
            cross: false
            app: true

          # Built natively on GitHub's ARM runner: cross-compiling fastembed's
          # ONNX Runtime did not work, and the app needs GTK 4.14.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: linux-aarch64
            cross: false
            app: true

          - target: x86_64-apple-darwin
            os: macos-15
            name: macos-x86_64
            cross: false
            app: true

          - target: aarch64-apple-darwin
            os: macos-15
            name: macos-aarch64
            cross: false
            app: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The toolchain comes from rust-toolchain.toml.
      # ONNX Runtime's prebuilt library (ort-sys, through fastembed), fetched
      # from pyke's CDN by every build; a truncated download failed the
      # v0.21.0 Linux build.
      - name: Cache ONNX Runtime download
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
          # Same key as ci.yml's build check, so a release restores the copy
          # master saved (a tag's own caches are not shared).
          key: ort-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && !matrix.cross
        uses: ./.github/actions/apt-install
        with:
          # The app's desktop backend links GTK 4 (see the `app` job in ci.yml).
          packages: libdbus-1-dev pkg-config libssl-dev libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwayland-dev clang

      # Intel Macs: ONNX Runtime from a pinned static library (see the script).
      - name: ONNX Runtime (Intel Mac)
        if: matrix.target == 'x86_64-apple-darwin'
        run: scripts/onnxruntime-intel-mac.sh "$RUNNER_TEMP/onnxruntime" >> "$GITHUB_ENV"

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }} --features "browser"

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      # The app (`aidaemon app` / `aidaemon tui` launch it from beside the
      # daemon). Its own Cargo workspace, so its target dir is clients/app/target.
      # The apps are the release: a failed build fails it.
      - name: Build app
        if: matrix.app
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path clients/app/Cargo.toml

      - name: Package (Unix)
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp target/${{ matrix.target }}/release/aidaemon "$stage/"
          app_bin="clients/app/target/${{ matrix.target }}/release/aidaemon-app"
          if [ "${{ matrix.app }}" = "true" ]; then
            cp "$app_bin" "$stage/"
          fi
          tar -czvf aidaemon-${{ matrix.name }}.tar.gz -C "$stage" .
          shasum -a 256 aidaemon-${{ matrix.name }}.tar.gz > aidaemon-${{ matrix.name }}.tar.gz.sha256

      # The download for people who do not use a terminal: AIdaemon.app with
      # the daemon inside, in a disk image, signed and notarized.
      - name: Signing (macOS)
        if: runner.os == 'macOS' && matrix.app
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: scripts/ci-macos-signing.sh >> "$GITHUB_ENV"

      - name: Package disk image (macOS)
        if: runner.os == 'macOS' && matrix.app
        run: |
          set -euo pipefail
          # Bundle versions are numeric: an rc tag's suffix is dropped.
          version="${GITHUB_REF_NAME#v}"
          scripts/package-macos-dmg.sh \
            target/${{ matrix.target }}/release/aidaemon \
            clients/app/target/${{ matrix.target }}/release/aidaemon-app \
            "${version%%-*}" "AIdaemon-${{ matrix.name }}.dmg"
          shasum -a 256 "AIdaemon-${{ matrix.name }}.dmg" > "AIdaemon-${{ matrix.name }}.dmg.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aidaemon-${{ matrix.name }}
          path: |
            aidaemon-${{ matrix.name }}.tar.gz
            aidaemon-${{ matrix.name }}.tar.gz.sha256
            AIdaemon-${{ matrix.name }}.dmg
            AIdaemon-${{ matrix.name }}.dmg.sha256

  # The Windows download: aidaemon.exe and aidaemon-app.exe side by side in a
  # zip. The app finds the daemon beside it and "Run it here" installs it as
  # a logon task. Built like ci.yml's Windows jobs (vcpkg's static OpenSSL
  # for SQLCipher).
  build-windows:
    name: Build windows-x86_64
    needs: [quality-gate]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install && rustc --version

      - uses: actions/cache@v4
        id: openssl
        with:
          path: C:\vcpkg\installed\x64-windows-static-md
          key: vcpkg-openssl-x64-windows-static-md-v1

      - name: Install OpenSSL
        if: steps.openssl.outputs.cache-hit != 'true'
        shell: pwsh
        run: vcpkg install openssl:x64-windows-static-md

      - name: Point the build at OpenSSL
        shell: pwsh
        run: |
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build daemon
        run: cargo build --release --locked --features "browser"

      - name: Build app
        run: cargo build --release --locked --manifest-path clients/app/Cargo.toml

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\aidaemon-windows"
          Copy-Item target\release\aidaemon.exe $stage
          Copy-Item clients\app\target\release\aidaemon-app.exe $stage
          Copy-Item LICENSE $stage
          Compress-Archive -Path "$stage\*" -DestinationPath aidaemon-windows-x86_64.zip
          $hash = (Get-FileHash aidaemon-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  aidaemon-windows-x86_64.zip" | Out-File -Encoding ascii -NoNewline aidaemon-windows-x86_64.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aidaemon-windows-x86_64
          path: |
            aidaemon-windows-x86_64.zip
            aidaemon-windows-x86_64.zip.sha256

  # The app's web build, once: the daemon's gateway serves it from
  # ~/.aidaemon/app-web at /client/v1/next/ (install.sh puts it there).
  web-app:
    name: Build web app
    needs: [quality-gate]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustc --version

      - name: Install wasm C toolchain
        uses: ./.github/actions/apt-install
        with:
          # nsh package also compiles native crates (glib-sys and the rest of
          # the GTK 4 stack), as the Linux app job does.
          packages: clang-18 llvm-18 libgtk-4-dev clang pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwayland-dev

      - name: Install nsh CLI
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/longbridge/nsh/releases/download/v${NSH_VERSION}/nsh-linux-x86_64.tar.gz" -o nsh.tar.gz
          echo "${NSH_LINUX_SHA256}  nsh.tar.gz" | sha256sum -c -
          # The archive holds one nsh/ folder (bin/nsh, runtime/).
          tar -xzf nsh.tar.gz -C "$HOME"
          test -x "$HOME/nsh/bin/nsh"
          rm nsh.tar.gz
          echo "$HOME/nsh/bin" >> "$GITHUB_PATH"

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_CLI_VERSION }}

      - name: Build web bundle
        working-directory: clients/app
        env:
          CC_wasm32_unknown_unknown: clang-18
          AR_wasm32_unknown_unknown: llvm-ar-18
        run: |
          nsh --version
          nsh package --target web

      - name: Package
        run: |
          set -euo pipefail
          out=clients/app/.nsh/out/AIdaemon
          test -f "$out/index.html"
          # Everything nsh wrote, including its precompressed .br/.gz files.
          tar -czvf aidaemon-app-web.tar.gz -C "$out" .
          shasum -a 256 aidaemon-app-web.tar.gz > aidaemon-app-web.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aidaemon-app-web
          path: |
            aidaemon-app-web.tar.gz
            aidaemon-app-web.tar.gz.sha256

  release:
    name: Create Release
    needs: [build, build-windows, web-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.sha256

  # The phone apps run after the release so a store-side failure never holds
  # the downloads back. Each one is skipped (green, no package) until its
  # signing secrets are set: an APK signed with a throwaway debug key could
  # never be updated in place.
  android-app:
    name: Android app
    needs: [release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/checkout@v5

      - name: Install Rust
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Install a JDK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install nsh CLI
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/longbridge/nsh/releases/download/v${NSH_VERSION}/nsh-linux-x86_64.tar.gz" -o nsh.tar.gz
          echo "${NSH_LINUX_SHA256}  nsh.tar.gz" | sha256sum -c -
          tar -xzf nsh.tar.gz -C "$HOME"
          rm nsh.tar.gz
          echo "$HOME/nsh/bin" >> "$GITHUB_PATH"

      # `nsh package` builds the app for this machine too (its Linux
      # desktop dependencies: GTK, GStreamer, Wayland) before the phone.
      - name: Install Linux dependencies
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev clang pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwayland-dev

      - name: Package the app and publish it to Google Play
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          APP_VERSION: ${{ github.ref_name }}
        run: APP_VERSION="${APP_VERSION#v}" scripts/ci-android-package.sh

      - name: Attach the APK to the release
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" aidaemon-android.apk aidaemon-android.apk.sha256 --clobber

      # Kept too: Play has it once PLAY_SERVICE_ACCOUNT_JSON is set; else upload it in Play Console.
      - name: Keep the App Bundle
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: aidaemon-android-aab
          path: aidaemon-android.aab

  ios-app:
    name: iOS app (TestFlight)
    needs: [release]
    runs-on: macos-15
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
    steps:
      - name: Checkout
        if: env.IOS_CERTIFICATE_P12_BASE64 != ''
        uses: actions/checkout@v5

      - name: Import the signing certificate and profile
        if: env.IOS_CERTIFICATE_P12_BASE64 != ''
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: scripts/ci-ios-signing.sh >> "$GITHUB_ENV"

      - name: Install Rust
        if: env.IOS_SIGN_IDENTITY != ''
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios

      - name: Install nsh CLI
        if: env.IOS_SIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/longbridge/nsh/releases/download/v${NSH_VERSION}/nsh-macos-arm64.tar.gz" -o nsh.tar.gz
          echo "${NSH_MACOS_SHA256}  nsh.tar.gz" | shasum -a 256 -c -
          tar -xzf nsh.tar.gz -C "$HOME"
          rm nsh.tar.gz
          echo "$HOME/nsh/bin" >> "$GITHUB_PATH"

      - name: Package the IPA
        if: env.IOS_SIGN_IDENTITY != ''
        working-directory: clients/app
        run: |
          set -euo pipefail
          nsh component add ios
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          export AIDAEMON_APP_VERSION="$version" AIDAEMON_APP_BUILD="$GITHUB_RUN_NUMBER"
          nsh package --target ios --sign "$IOS_SIGN_IDENTITY" --profile "$IOS_PROFILE" \
            --app-version "$version" --build "$GITHUB_RUN_NUMBER"

      - name: Upload to TestFlight
        if: env.IOS_SIGN_IDENTITY != '' && env.NSH_APP_STORE_PRIVATE_KEY != ''
        working-directory: clients/app
        env:
          NSH_APP_STORE_APP_ID: ${{ secrets.APPSTORE_APP_ID }}
          NSH_APP_STORE_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          NSH_APP_STORE_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: nsh publish ios .nsh/out/AIdaemon.ipa

  publish-crates:
    name: Publish to crates.io
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # crates.io lets an account publish a few new crates at once, then one
    # every ten minutes: a release that adds many crates takes hours.
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install && rustc --version

      - name: Validate tag matches crate version
        id: release_meta
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION="$(
            awk '
              /^\[package\]$/ { in_package=1; next }
              /^\[/ && in_package { exit }
              in_package && /^version = / {
                gsub(/^version = "/, "", $0)
                gsub(/"$/, "", $0)
                print
                exit
              }
            ' Cargo.toml
          )"

          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "crate_version=${CRATE_VERSION}" >> "$GITHUB_OUTPUT"

          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CRATE_VERSION}."
            exit 1
          fi

      # The daemon must pin exactly the SDK version being published.
      - name: Check the daemon's SDK pin
        run: |
          set -euo pipefail
          version="$(sed -nE '/^\[workspace\.package\]/,/^\[/ s/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)"
          test -n "$version"
          if ! grep -qE "^aidaemon-core = \{ version = \"=${version}\"" Cargo.toml; then
            echo "::error::The daemon's aidaemon-core pin does not match workspace version ${version}."
            exit 1
          fi

      - name: Install Linux dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: libdbus-1-dev pkg-config libssl-dev

      # Every publishable crate in dependency order (scripts/publish-order.py
      # reads it from cargo metadata, so a new crate needs no list here).
      # `--no-verify`: CI's "Package crates" job already built every crate
      # from its packaged sources on this commit; rebuilding 30+ crates one
      # by one here took most of the publish time.
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured."
            exit 1
          fi

          # Already on crates.io (an earlier, interrupted run, or a crate whose
          # own version did not change): skip it.
          already_published() {
            local code
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -A 'aidaemon-release (https://github.com/davo20019/aidaemon)' \
              "https://crates.io/api/v1/crates/$1/$2")"
            [ "$code" = "200" ]
          }

          publish_package() {
            local package="$1" log_file status
            log_file="$(mktemp)"
            for try in $(seq 1 40); do
              set +e
              cargo publish --locked --no-verify -p "$package" 2>&1 | tee "$log_file"
              status=${PIPESTATUS[0]}
              set -e
              # crates.io's rate limit (new crates: one every ten minutes;
              # new versions: a burst, then one a minute). cargo reports only
              # the HTTP status in its error text (a machine format), so wait
              # for the time crates.io names, or a minute, and retry.
              if [ "$status" -ne 0 ] && grep -qE '\b429\b|Too Many Requests' "$log_file"; then
                wait_s=60
                if grep -qE 'new crates' "$log_file"; then wait_s=600; fi
                echo "crates.io rate limit on ${package} (try ${try}); waiting ${wait_s}s."
                sleep "$wait_s"
                continue
              fi
              break
            done
            if [ "$status" -ne 0 ] && ! grep -Eqi 'already (uploaded|exists|been uploaded)' "$log_file"; then
              echo "::error::cargo publish failed for ${package}."
              exit "$status"
            fi
          }

          versions="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | "\(.name) \(.version)"')"
          for package in $(scripts/publish-order.py --check); do
            version="$(awk -v n="$package" '$1 == n { print $2 }' <<<"$versions")"
            if already_published "$package" "$version"; then
              echo "${package} ${version} is already on crates.io; skipping."
              continue
            fi
            publish_package "$package"
          done

  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Download release assets and compute SHA256
        id: sha
        run: |
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}"

          curl -sL "${BASE_URL}/aidaemon-macos-aarch64.tar.gz" -o macos-aarch64.tar.gz
          curl -sL "${BASE_URL}/aidaemon-macos-x86_64.tar.gz" -o macos-x86_64.tar.gz
          curl -sL "${BASE_URL}/aidaemon-linux-x86_64.tar.gz" -o linux-x86_64.tar.gz
          curl -sL "${BASE_URL}/aidaemon-linux-aarch64.tar.gz" -o linux-aarch64.tar.gz

          echo "macos_arm64=$(sha256sum macos-aarch64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "macos_x86_64=$(sha256sum macos-x86_64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_x86_64=$(sha256sum linux-x86_64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum linux-aarch64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        uses: actions/checkout@v5
        with:
          repository: davo20019/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        run: |
          mkdir -p Formula
          cat > Formula/aidaemon.rb << 'RUBY'
          class Aidaemon < Formula
            desc "Personal AI agent daemon with tool use, MCP integration, and persistent memory"
            homepage "https://aidaemon.ai/"
            license "MIT"
            version "VERSION_PLACEHOLDER"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/davo20019/aidaemon/releases/download/vVERSION_PLACEHOLDER/aidaemon-macos-aarch64.tar.gz"
                sha256 "SHA_MACOS_ARM64_PLACEHOLDER"
              else
                url "https://github.com/davo20019/aidaemon/releases/download/vVERSION_PLACEHOLDER/aidaemon-macos-x86_64.tar.gz"
                sha256 "SHA_MACOS_X86_64_PLACEHOLDER"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/davo20019/aidaemon/releases/download/vVERSION_PLACEHOLDER/aidaemon-linux-aarch64.tar.gz"
                sha256 "SHA_LINUX_ARM64_PLACEHOLDER"
              else
                url "https://github.com/davo20019/aidaemon/releases/download/vVERSION_PLACEHOLDER/aidaemon-linux-x86_64.tar.gz"
                sha256 "SHA_LINUX_X86_64_PLACEHOLDER"
              end
            end

            def install
              bin.install "aidaemon"
              # The app (`aidaemon app` / `aidaemon tui`); older archives lack it.
              bin.install "aidaemon-app" if File.exist?("aidaemon-app")
            end

            test do
              assert_match "aidaemon", shell_output("#{bin}/aidaemon --version", 0)
            end
          end
          RUBY

          sed -i "s/VERSION_PLACEHOLDER/${{ steps.release.outputs.version }}/g" Formula/aidaemon.rb
          sed -i "s/SHA_MACOS_ARM64_PLACEHOLDER/${{ steps.sha.outputs.macos_arm64 }}/g" Formula/aidaemon.rb
          sed -i "s/SHA_MACOS_X86_64_PLACEHOLDER/${{ steps.sha.outputs.macos_x86_64 }}/g" Formula/aidaemon.rb
          sed -i "s/SHA_LINUX_X86_64_PLACEHOLDER/${{ steps.sha.outputs.linux_x86_64 }}/g" Formula/aidaemon.rb
          sed -i "s/SHA_LINUX_ARM64_PLACEHOLDER/${{ steps.sha.outputs.linux_arm64 }}/g" Formula/aidaemon.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/aidaemon.rb
          git commit -m "Update aidaemon to ${{ steps.release.outputs.version }}"
          git push
